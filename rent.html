<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Purchase</title>
    <link rel="stylesheet" href="all.css">
    <style>
     
        .container {
    display: flex;
    padding: 40px;
    gap: 40px;
    max-width: 1000px;
    margin: auto;
    height:50%;
    margin-top: 2%;
}
 .container div{
    background-color:rgba(0, 0, 0, 0.6);
    display:flex;
    flex-direction:column;
    align-items: center;
    justify-content: center;
    gap:25px;
    width:500px;
    height: 500px;
    color:white;
    border-radius: 8px ;
 }
 

 .container div img {
    height: 400px;
    width: 300px;
 }
 #book-price{
    font-size: 25px;
 }
footer{
    height:50px;
    width:100%;
}
    </style>
</head>
<body>
    <header>
        <h1>Book Haven</h1>
    </header>

    <div class="container">
        <div><h2 id="book-title">Loading...</h2>
        <img id="book-image" src="" alt="Book Image">
        </div>
        <div>
        <p id="book-price">Price: $0.00</p>
        <button class="buy">add to Cart</button>
        <button class="rent" onclick="window.history.back()">Go Back</button>
        </div>
        
    </div>
    <footer>
        <p>&copy; 2025 Book Haven. All rights reserved.</p>
    </footer>

    <script>
        const title = localStorage.getItem("bookTitle");
        const image = localStorage.getItem("bookImage");
        const price = localStorage.getItem("bookPrice");
        const mode = localStorage.getItem("mode");

        document.getElementById("book-title").textContent = title;
        document.getElementById("book-image").src = image;
        document.getElementById("book-price").textContent = (mode === "buy" ? "Buy" : "Rent") + " Price: " + price + " ETB" ;
    </script>
</body>
</html>
